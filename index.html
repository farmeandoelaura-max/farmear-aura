<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Farmear Aura — V3.1 Aura World</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:system-ui,-apple-system,sans-serif;
  background:#05040a;
  color:#fff;
  overflow-x:hidden;
}

body{
  background:radial-gradient(circle at top,#32105e,#08040f 55%,#020207);
}

body.zone-Escuela{
  background:radial-gradient(circle at top,#334155,#0f172a 55%,#020617);
}

body.zone-Ciudad{
  background:radial-gradient(circle at top,#26364d,#0b1728 55%,#05070b);
}

body.zone-Noche{
  background:radial-gradient(circle at top,#4c1d95,#17052f 55%,#05010d);
}

body.zone-Dimension{
  background:radial-gradient(circle at top,#a21caf,#4c1d95 50%,#10001e);
}

body.awakened{
  animation:pulse .7s infinite alternate;
}

@keyframes pulse{
  from{filter:brightness(1)}
  to{filter:brightness(1.35) hue-rotate(12deg)}
}

.game{
  width:100%;
  max-width:600px;
  margin:auto;
  padding:10px;
}

.top{
  text-align:center;
}

h1{
  margin:5px 0;
  font-size:31px;
  text-shadow:0 0 20px rgba(255,79,216,.5);
}

.sub{
  color:#cbd5e1;
  font-size:13px;
  margin-bottom:9px;
}

.card{
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.09);
  border-radius:22px;
  padding:13px;
  margin:9px 0;
  box-shadow:0 12px 35px rgba(0,0,0,.5);
  backdrop-filter:blur(8px);
}

/* ==============================
   AURA
============================== */

.aura{
  text-align:center;
  font-size:43px;
  font-weight:950;
}

.rank{
  text-align:center;
  color:#facc15;
  font-size:19px;
  font-weight:900;
}

.bar{
  height:10px;
  background:rgba(0,0,0,.45);
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

.fill{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#9b5cff,#ff4fd8,#ffe66d);
  transition:.2s;
}

.progress{
  text-align:center;
  color:#94a3b8;
  font-size:11px;
  margin-top:5px;
}

/* ==============================
   MUNDO
============================== */

.world-wrap{
  width:100%;
  height:430px;
  margin-top:12px;
  overflow:hidden;
  border-radius:24px;
  position:relative;
  border:2px solid rgba(255,255,255,.1);
  background:#080612;
  box-shadow:
    inset 0 0 70px rgba(0,0,0,.8),
    0 0 30px rgba(123,57,201,.15);
  touch-action:none;
}

.world{
  position:absolute;
  width:1600px;
  height:1200px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  overflow:hidden;
  transition:background .5s;
}

.zone-Escuela .world{
  background:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
    radial-gradient(circle,#334155,#111827 75%);
  background-size:50px 50px,50px 50px,100% 100%;
}

.zone-Ciudad .world{
  background:
    linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px),
    radial-gradient(circle,#23415d,#070d16 75%);
  background-size:50px 50px,50px 50px,100% 100%;
}

.zone-Noche .world{
  background:
    linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px),
    radial-gradient(circle,#4c1d72,#10031d 75%);
  background-size:50px 50px,50px 50px,100% 100%;
}

.zone-Dimension .world{
  background:
    linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px),
    radial-gradient(circle,#a21caf,#27042f 75%);
  background-size:50px 50px,50px 50px,100% 100%;
}

/* ==============================
   DECORACIÓN
============================== */

.building{
  position:absolute;
  width:150px;
  height:110px;
  border-radius:15px;
  background:linear-gradient(#475569,#1e293b);
  border:3px solid rgba(255,255,255,.08);
  box-shadow:0 12px 25px rgba(0,0,0,.35);
}

.building::before{
  content:"";
  position:absolute;
  left:18px;
  right:18px;
  top:20px;
  height:35px;
  background:
    repeating-linear-gradient(
      90deg,
      #93c5fd 0 18px,
      transparent 18px 28px
    );
  opacity:.55;
}

.building::after{
  content:"";
  position:absolute;
  width:40px;
  height:45px;
  bottom:0;
  left:55px;
  background:#0f172a;
  border-radius:10px 10px 0 0;
}

.tree{
  position:absolute;
  width:50px;
  height:70px;
}

.tree::before{
  content:"";
  position:absolute;
  width:45px;
  height:45px;
  border-radius:50%;
  left:2px;
  top:0;
  background:#166534;
  box-shadow:15px -8px 0 #15803d;
}

.tree::after{
  content:"";
  position:absolute;
  width:12px;
  height:35px;
  left:20px;
  top:37px;
  background:#78350f;
  border-radius:4px;
}

/* ==============================
   JUGADOR
============================== */

.player{
  position:absolute;
  width:58px;
  height:86px;
  transform:translate(-50%,-50%);
  z-index:40;
  pointer-events:none;
}

.player-aura{
  position:absolute;
  inset:-20px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,79,216,.16),transparent 68%);
  animation:auraPulse 1s infinite alternate;
}

@keyframes auraPulse{
  from{transform:scale(.8);opacity:.4}
  to{transform:scale(1.2);opacity:1}
}

.head{
  position:absolute;
  width:33px;
  height:36px;
  left:12px;
  top:4px;
  border-radius:50%;
  background:#f6c453;
  z-index:5;
}

.hair{
  position:absolute;
  width:37px;
  height:15px;
  left:-2px;
  top:-3px;
  border-radius:16px 16px 5px 5px;
  background:#29170b;
}

.eye{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#111;
  top:18px;
}

.eye.l{left:7px}
.eye.r{right:7px}

.body{
  position:absolute;
  width:42px;
  height:34px;
  left:8px;
  top:37px;
  border-radius:10px 10px 4px 4px;
  background:#2563eb;
}

.arm{
  position:absolute;
  width:9px;
  height:30px;
  top:39px;
  background:#f6c453;
  border-radius:8px;
}

.arm.l{
  left:1px;
  transform:rotate(8deg);
}

.arm.r{
  right:1px;
  transform:rotate(-8deg);
}

.leg{
  position:absolute;
  width:13px;
  height:27px;
  top:67px;
  background:#1e293b;
  border-radius:4px;
}

.leg.l{left:14px}
.leg.r{right:14px}

.player.running .leg.l{
  animation:run1 .16s infinite alternate;
}

.player.running .leg.r{
  animation:run2 .16s infinite alternate;
}

.player.running .arm.l{
  animation:arm1 .16s infinite alternate;
}

.player.running .arm.r{
  animation:arm2 .16s infinite alternate;
}

@keyframes run1{
  from{transform:rotate(22deg)}
  to{transform:rotate(-22deg)}
}

@keyframes run2{
  from{transform:rotate(-22deg)}
  to{transform:rotate(22deg)}
}

@keyframes arm1{
  from{transform:rotate(-20deg)}
  to{transform:rotate(20deg)}
}

@keyframes arm2{
  from{transform:rotate(20deg)}
  to{transform:rotate(-20deg)}
}

/* SIGMA */

.player.Sigma .head{
  background:#d99b62;
}

.player.Sigma .hair{
  background:#111;
  height:12px;
}

.player.Sigma .body{
  background:#111827;
}

.player.Sigma .arm{
  background:#d99b62;
}

/* CHAD */

.player.Chad{
  transform:translate(-50%,-50%) scale(1.1);
}

.player.Chad .head{
  background:#d97706;
  border-radius:9px 9px 18px 18px;
}

.player.Chad .body{
  background:#dc2626;
  width:48px;
  left:5px;
}

.player.Chad .arm{
  background:#d97706;
  width:12px;
}

/* MASTER */

.player.Master{
  transform:translate(-50%,-50%) scale(1.15);
  filter:drop-shadow(0 0 17px #e879f9);
}

.player.Master .head{
  background:#c084fc;
}

.player.Master .hair{
  background:#fde047;
  height:9px;
}

.player.Master .body{
  background:#581c87;
}

.player.Master .arm{
  background:#c084fc;
}

.player.Master .leg{
  background:#fde047;
}

/* ==============================
   ORBES
============================== */

.orb{
  position:absolute;
  width:28px;
  height:28px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  z-index:20;
  box-shadow:0 0 15px currentColor,0 0 35px currentColor;
  animation:orbFloat .8s infinite alternate;
}

.orb::after{
  content:"";
  position:absolute;
  width:8px;
  height:8px;
  left:6px;
  top:5px;
  border-radius:50%;
  background:white;
  opacity:.8;
}

.orb.common{
  background:#a855f7;
  color:#a855f7;
}

.orb.rare{
  width:36px;
  height:36px;
  background:#22d3ee;
  color:#22d3ee;
}

.orb.epic{
  width:41px;
  height:41px;
  background:#f97316;
  color:#f97316;
}

.orb.legendary{
  width:48px;
  height:48px;
  background:#ffe66d;
  color:#ffe66d;
  animation:orbFloat .6s infinite alternate,legend .7s infinite alternate;
}

@keyframes orbFloat{
  from{transform:translate(-50%,-50%) translateY(-4px)}
  to{transform:translate(-50%,-50%) translateY(5px)}
}

@keyframes legend{
  from{filter:brightness(1)}
  to{filter:brightness(1.8)}
}

/* ==============================
   ENEMIGOS
============================== */

.enemy{
  position:absolute;
  width:54px;
  height:54px;
  transform:translate(-50%,-50%);
  z-index:30;
}

.enemy-body{
  position:absolute;
  inset:6px;
  border-radius:50% 50% 35% 35%;
  background:#dc2626;
  box-shadow:0 0 18px rgba(239,68,68,.55);
}

.enemy-eye{
  position:absolute;
  width:8px;
  height:8px;
  top:21px;
  border-radius:50%;
  background:#ffe66d;
  z-index:2;
  box-shadow:0 0 8px #ffe66d;
}

.enemy-eye.l{left:16px}
.enemy-eye.r{right:16px}

.enemy.damaged{
  animation:damageFlash .15s;
}

@keyframes damageFlash{
  50%{filter:brightness(2)}
}

/* ==============================
   COFRES
============================== */

.chest{
  position:absolute;
  width:45px;
  height:35px;
  transform:translate(-50%,-50%);
  z-index:25;
  border-radius:5px 5px 8px 8px;
  background:#92400e;
  border:3px solid #fbbf24;
  box-shadow:0 0 15px rgba(251,191,36,.4);
}

.chest::after{
  content:"";
  position:absolute;
  width:7px;
  height:10px;
  left:17px;
  top:11px;
  background:#fde68a;
  border-radius:2px;
}

/* ==============================
   NPC
============================== */

.npc{
  position:absolute;
  width:42px;
  height:65px;
  transform:translate(-50%,-50%);
  z-index:15;
  animation:npcWalk 5s infinite alternate ease-in-out;
}

.npc-head{
  position:absolute;
  width:25px;
  height:27px;
  left:9px;
  top:0;
  border-radius:50%;
  background:#f6c453;
}

.npc-body{
  position:absolute;
  width:30px;
  height:28px;
  left:6px;
  top:28px;
  border-radius:7px;
  background:#64748b;
}

.npc::after{
  content:"";
  position:absolute;
  width:9px;
  height:20px;
  left:16px;
  bottom:0;
  background:#1e293b;
}

@keyframes npcWalk{
  from{margin-left:-20px}
  to{margin-left:20px}
}

/* ==============================
   JEFE
============================== */

.boss{
  position:absolute;
  width:85px;
  height:95px;
  transform:translate(-50%,-50%);
  z-index:35;
}

.boss-body{
  position:absolute;
  width:72px;
  height:68px;
  left:7px;
  bottom:0;
  border-radius:50% 50% 25% 25%;
  background:linear-gradient(135deg,#ef4444,#7f1d1d);
  box-shadow:0 0 30px rgba(239,68,68,.65);
}

.boss-horn{
  position:absolute;
  width:19px;
  height:35px;
  top:0;
  background:#fca5a5;
  border-radius:12px 12px 3px 3px;
}

.boss-horn.l{
  left:9px;
  transform:rotate(-25deg);
}

.boss-horn.r{
  right:9px;
  transform:rotate(25deg);
}

.boss-eye{
  position:absolute;
  width:11px;
  height:11px;
  top:28px;
  border-radius:50%;
  background:#ffe66d;
  z-index:4;
  box-shadow:0 0 10px #ffe66d;
}

.boss-eye.l{left:26px}
.boss-eye.r{right:26px}

/* ==============================
   CONTROLES
============================== */

.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:9px;
}

.joystick{
  width:105px;
  height:105px;
  border-radius:50%;
  background:rgba(255,255,255,.07);
  border:2px solid rgba(255,255,255,.1);
  position:relative;
  touch-action:none;
}

.stick{
  position:absolute;
  width:47px;
  height:47px;
  left:27px;
  top:27px;
  border-radius:50%;
  background:rgba(255,255,255,.2);
  border:2px solid rgba(255,255,255,.15);
}

.actions{
  display:flex;
  gap:9px;
}

.action{
  width:74px;
  height:74px;
  border:0;
  border-radius:50%;
  color:#fff;
  font-size:11px;
  font-weight:950;
  background:linear-gradient(135deg,#7b39c9,#e83fbb);
  box-shadow:0 0 20px rgba(214,70,255,.35);
}

.action.attack{
  background:linear-gradient(135deg,#dc2626,#f97316);
}

.action.skill{
  background:linear-gradient(135deg,#0891b2,#7c3aed);
}

.action:active{
  transform:scale(.9);
}

/* ==============================
   UI
============================== */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:9px;
}

.stat{
  padding:8px 3px;
  background:rgba(0,0,0,.28);
  border-radius:12px;
  text-align:center;
  color:#94a3b8;
  font-size:9px;
}

.stat b{
  display:block;
  color:#fff;
  font-size:14px;
  margin-top:3px;
}

.event{
  text-align:center;
  min-height:38px;
  margin-top:9px;
  padding:9px;
  border-radius:12px;
  background:rgba(255,255,255,.035);
  font-size:12px;
}

.presence{
  background:linear-gradient(135deg,rgba(123,57,201,.2),rgba(0,0,0,.4));
}

.presence-header{
  display:flex;
  justify-content:space-between;
  font-weight:900;
}

.presbar{
  height:10px;
  background:rgba(0,0,0,.4);
  border-radius:20px;
  overflow:hidden;
  margin-top:7px;
}

.presfill{
  width:0;
  height:100%;
  background:linear-gradient(90deg,#5de7ff,#d55cff,#ffe66d);
  transition:.3s;
}

.notice{
  margin-top:8px;
  padding:8px;
  border-radius:10px;
  background:rgba(0,0,0,.2);
  color:#cbd5e1;
  text-align:center;
  font-size:12px;
}

.tabs{
  display:flex;
  gap:6px;
  margin-bottom:9px;
}

.tab{
  flex:1;
  padding:10px;
  border:0;
  border-radius:11px;
  background:rgba(255,255,255,.05);
  color:#94a3b8;
  font-weight:900;
}

.tab.active{
  background:#7b39c9;
  color:#fff;
}

.panel{
  display:none;
}

.panel.active{
  display:block;
}

.shopitem{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:10px;
  margin:6px 0;
  border-radius:12px;
  background:rgba(0,0,0,.25);
}

.shopitem small{
  color:#94a3b8;
}

.buy{
  border:0;
  border-radius:9px;
  padding:9px 12px;
  background:#a13fe0;
  color:#fff;
  font-weight:900;
}

.buy:disabled{
  opacity:.3;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.choice{
  padding:10px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.3);
  color:white;
  text-align:left;
}

.choice strong{
  display:block;
}

.choice small{
  color:#94a3b8;
}

.choice.active{
  border-color:#d05cff;
  box-shadow:0 0 18px rgba(166,60,255,.3);
}

.missions{
  display:grid;
  gap:7px;
}

.mission{
  padding:10px;
  border-radius:12px;
  background:rgba(0,0,0,.25);
  border:1px solid rgba(255,255,255,.05);
}

.mission-title{
  font-weight:900;
}

.mission-progress{
  height:6px;
  margin-top:6px;
  border-radius:20px;
  overflow:hidden;
  background:#020617;
}

.mission-fill{
  height:100%;
  width:0;
  background:#d946ef;
}

.log{
  max-height:100px;
  overflow:auto;
  color:#94a3b8;
  font-size:11px;
}

.log div{
  padding:4px 0;
  border-bottom:1px solid rgba(255,255,255,.03);
}

.reset{
  display:block;
  margin:12px auto 0;
  background:transparent;
  color:#64748b;
  border:0;
  font-size:11px;
}

.pop{
  position:fixed;
  z-index:9999;
  pointer-events:none;
  font-weight:950;
  font-size:21px;
  color:#ffe66d;
  text-shadow:0 2px 10px #000;
  animation:pop .8s forwards;
}

@keyframes pop{
  to{
    opacity:0;
    transform:translateY(-80px) scale(1.3);
  }
}

.damage{
  position:absolute;
  z-index:100;
  pointer-events:none;
  font-size:20px;
  font-weight:950;
  color:#ffe66d;
  text-shadow:0 2px 8px #000;
  animation:damage .7s forwards;
}

@keyframes damage{
  to{
    opacity:0;
    transform:translateY(-50px) scale(1.3);
  }
}

.combo{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:100;
  font-weight:950;
  color:#ffe66d;
  text-shadow:0 0 12px #ff4fd8;
  pointer-events:none;
}

@media(max-width:390px){

  .world-wrap{
    height:390px;
  }

  .joystick{
    width:90px;
    height:90px;
  }

  .stick{
    left:21px;
    top:21px;
  }

  .action{
    width:66px;
    height:66px;
  }
}
</style>
</head>

<body class="zone-Escuela">

<div class="game">

<div class="top">
<h1>🔥 FARMEAR AURA</h1>
<div class="sub">V3.1 — AURA WORLD</div>
</div>

<div class="card">

<div class="aura" id="aura">0</div>
<div class="rank" id="rank">NPC</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="progress" id="progress"></div>

<!-- =========================
     MUNDO
========================= -->

<div class="world-wrap" id="worldWrap">

<div class="world" id="world">

<!-- DECORACIÓN -->

<div class="building" style="left:170px;top:170px"></div>
<div class="building" style="left:1160px;top:230px"></div>
<div class="building" style="left:750px;top:850px"></div>

<div class="tree" style="left:80px;top:100px"></div>
<div class="tree" style="left:450px;top:150px"></div>
<div class="tree" style="left:1000px;top:110px"></div>
<div class="tree" style="left:1370px;top:400px"></div>
<div class="tree" style="left:260px;top:950px"></div>
<div class="tree" style="left:1250px;top:900px"></div>

<!-- JUGADOR -->

<div class="player" id="player">

<div class="player-aura"></div>

<div class="head">
<div class="hair"></div>
<div class="eye l"></div>
<div class="eye r"></div>
</div>

<div class="body"></div>

<div class="arm l"></div>
<div class="arm r"></div>

<div class="leg l"></div>
<div class="leg r"></div>

</div>

<!-- JEFE -->

<div class="boss" id="boss">

<div class="boss-horn l"></div>
<div class="boss-horn r"></div>

<div class="boss-body"></div>
